# PIPELINE DEFINITION
# Name: red-wine-quality-pipeline
# Inputs:
#    bucket_name: str
#    dataset_file_name: str
#    model_bucket_name: str
#    project_id: str
#    thresholds_dict_str: str
#    trigger_id: str
# Outputs:
#    evaluate-model-2-kpi: system.Metrics
#    evaluate-model-2-metrics: system.ClassificationMetrics
#    evaluate-model-3-kpi: system.Metrics
#    evaluate-model-3-metrics: system.ClassificationMetrics
#    evaluate-model-kpi: system.Metrics
#    evaluate-model-metrics: system.ClassificationMetrics
components:
  comp-condition-1:
    dag:
      outputs:
        artifacts:
          evaluate-model-kpi:
            artifactSelectors:
            - outputArtifactKey: kpi
              producerSubtask: evaluate-model
          evaluate-model-metrics:
            artifactSelectors:
            - outputArtifactKey: metrics
              producerSubtask: evaluate-model
      tasks:
        condition-2:
          componentRef:
            name: comp-condition-2
          dependentTasks:
          - evaluate-model
          inputs:
            artifacts:
              pipelinechannel--train-knn-knn_model:
                componentInputArtifact: pipelinechannel--train-knn-knn_model
            parameters:
              pipelinechannel--evaluate-model-approval:
                taskOutputParameter:
                  outputParameterKey: approval
                  producerTask: evaluate-model
              pipelinechannel--model_bucket_name:
                componentInputParameter: pipelinechannel--model_bucket_name
              pipelinechannel--project_id:
                componentInputParameter: pipelinechannel--project_id
              pipelinechannel--select-best-model-Output:
                componentInputParameter: pipelinechannel--select-best-model-Output
              pipelinechannel--trigger_id:
                componentInputParameter: pipelinechannel--trigger_id
          taskInfo:
            name: condition-2
          triggerPolicy:
            condition: inputs.parameter_values['pipelinechannel--evaluate-model-approval']
              == true
        evaluate-model:
          cachingOptions:
            enableCache: true
          componentRef:
            name: comp-evaluate-model
          inputs:
            artifacts:
              input_data:
                componentInputArtifact: pipelinechannel--preprocess-data-processed_test_data
              model:
                componentInputArtifact: pipelinechannel--train-knn-knn_model
            parameters:
              thresholds_dict_str:
                componentInputParameter: pipelinechannel--thresholds_dict_str
          taskInfo:
            name: evaluate-model
    inputDefinitions:
      artifacts:
        pipelinechannel--preprocess-data-processed_test_data:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        pipelinechannel--train-knn-knn_model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        pipelinechannel--model_bucket_name:
          parameterType: STRING
        pipelinechannel--project_id:
          parameterType: STRING
        pipelinechannel--select-best-model-Output:
          parameterType: STRING
        pipelinechannel--thresholds_dict_str:
          parameterType: STRING
        pipelinechannel--trigger_id:
          parameterType: STRING
