pipelineInfo:
  name: red-wine-quality-pipeline
root:
  dag:
    outputs:
      artifacts:
        evaluate-model-2-kpi:
          artifactSelectors:
          - outputArtifactKey: evaluate-model-2-kpi
            producerSubtask: condition-3
        evaluate-model-2-metrics:
          artifactSelectors:
          - outputArtifactKey: evaluate-model-2-metrics
            producerSubtask: condition-3
        evaluate-model-3-kpi:
          artifactSelectors:
          - outputArtifactKey: evaluate-model-3-kpi
            producerSubtask: condition-5
        evaluate-model-3-metrics:
          artifactSelectors:
          - outputArtifactKey: evaluate-model-3-metrics
            producerSubtask: condition-5
        evaluate-model-kpi:
          artifactSelectors:
          - outputArtifactKey: evaluate-model-kpi
            producerSubtask: condition-1
        evaluate-model-metrics:
          artifactSelectors:
          - outputArtifactKey: evaluate-model-metrics
            producerSubtask: condition-1
    tasks:
      condition-1:
        componentRef:
          name: comp-condition-1
        dependentTasks:
        - preprocess-data
        - select-best-model
        - train-knn
        inputs:
          artifacts:
            pipelinechannel--preprocess-data-processed_test_data:
              taskOutputArtifact:
                outputArtifactKey: processed_test_data
                producerTask: preprocess-data
            pipelinechannel--train-knn-knn_model:
              taskOutputArtifact:
                outputArtifactKey: knn_model
                producerTask: train-knn
          parameters:
            pipelinechannel--model_bucket_name:
              componentInputParameter: model_bucket_name
            pipelinechannel--project_id:
              componentInputParameter: project_id
            pipelinechannel--select-best-model-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: select-best-model
            pipelinechannel--thresholds_dict_str:
              componentInputParameter: thresholds_dict_str
            pipelinechannel--trigger_id:
              componentInputParameter: trigger_id
        taskInfo:
          name: condition-1
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--select-best-model-Output']
            == 'KNN'
      condition-3:
        componentRef:
          name: comp-condition-3
        dependentTasks:
        - preprocess-data
        - select-best-model
        - train-random-forest
        inputs:
          artifacts:
            pipelinechannel--preprocess-data-processed_test_data:
              taskOutputArtifact:
                outputArtifactKey: processed_test_data
                producerTask: preprocess-data
            pipelinechannel--train-random-forest-rf_model:
              taskOutputArtifact:
                outputArtifactKey: rf_model
                producerTask: train-random-forest
          parameters:
            pipelinechannel--model_bucket_name:
              componentInputParameter: model_bucket_name
            pipelinechannel--project_id:
              componentInputParameter: project_id
            pipelinechannel--select-best-model-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: select-best-model
            pipelinechannel--thresholds_dict_str:
              componentInputParameter: thresholds_dict_str
            pipelinechannel--trigger_id:
              componentInputParameter: trigger_id
        taskInfo:
          name: condition-3
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--select-best-model-Output']
            == 'RandomForest'
      condition-5:
        componentRef:
          name: comp-condition-5
        dependentTasks:
        - preprocess-data
        - select-best-model
        - train-svm
        inputs:
          artifacts:
            pipelinechannel--preprocess-data-processed_test_data:
              taskOutputArtifact:
                outputArtifactKey: processed_test_data
                producerTask: preprocess-data
            pipelinechannel--train-svm-svm_model:
              taskOutputArtifact:
                outputArtifactKey: svm_model
                producerTask: train-svm
          parameters:
            pipelinechannel--model_bucket_name:
              componentInputParameter: model_bucket_name
            pipelinechannel--project_id:
              componentInputParameter: project_id
            pipelinechannel--select-best-model-Output:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: select-best-model
            pipelinechannel--thresholds_dict_str:
              componentInputParameter: thresholds_dict_str
            pipelinechannel--trigger_id:
              componentInputParameter: trigger_id
        taskInfo:
          name: condition-5
        triggerPolicy:
          condition: inputs.parameter_values['pipelinechannel--select-best-model-Output']
            == 'SVM'
      download-data-from-gcs:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-download-data-from-gcs
        inputs:
          parameters:
            bucket_name:
              componentInputParameter: bucket_name
            file_name:
              componentInputParameter: dataset_file_name
            project_id:
              componentInputParameter: project_id
        taskInfo:
          name: download-data-from-gcs
      preprocess-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-preprocess-data
        dependentTasks:
        - split-data
        inputs:
          artifacts:
            test_data:
              taskOutputArtifact:
                outputArtifactKey: test_data
                producerTask: split-data
            train_data:
              taskOutputArtifact:
                outputArtifactKey: train_data
                producerTask: split-data
        taskInfo:
          name: preprocess-data
      select-best-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-select-best-model
        dependentTasks:
        - train-knn
        - train-random-forest
        - train-svm
        inputs:
          parameters:
            knn_accuracy:
              taskOutputParameter:
                outputParameterKey: accuracy
                producerTask: train-knn
            rf_accuracy:
              taskOutputParameter:
                outputParameterKey: accuracy
                producerTask: train-random-forest
            svm_accuracy:
              taskOutputParameter:
                outputParameterKey: accuracy
                producerTask: train-svm
        taskInfo:
          name: select-best-model
      split-data:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-split-data
        dependentTasks:
        - download-data-from-gcs
        inputs:
          artifacts:
            input_data:
              taskOutputArtifact:
                outputArtifactKey: dataset
                producerTask: download-data-from-gcs
        taskInfo:
          name: split-data
      train-knn:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-knn
        dependentTasks:
        - preprocess-data
        inputs:
          artifacts:
            input_data:
              taskOutputArtifact:
                outputArtifactKey: processed_train_data
                producerTask: preprocess-data
        taskInfo:
          name: train-knn
      train-random-forest:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-random-forest
        dependentTasks:
        - preprocess-data
        inputs:
          artifacts:
            input_data:
              taskOutputArtifact:
                outputArtifactKey: processed_train_data
                producerTask: preprocess-data
        taskInfo:
          name: train-random-forest
      train-svm:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-train-svm
        dependentTasks:
        - preprocess-data
        inputs:
          artifacts:
            input_data:
              taskOutputArtifact:
                outputArtifactKey: processed_train_data
                producerTask: preprocess-data
        taskInfo:
          name: train-svm
  inputDefinitions:
    parameters:
      bucket_name:
        parameterType: STRING
      dataset_file_name:
        parameterType: STRING
      model_bucket_name:
        parameterType: STRING
      project_id:
        parameterType: STRING
      thresholds_dict_str:
        parameterType: STRING
      trigger_id:
        parameterType: STRING
  outputDefinitions:
    artifacts:
      evaluate-model-2-kpi:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
      evaluate-model-2-metrics:
        artifactType:
          schemaTitle: system.ClassificationMetrics
          schemaVersion: 0.0.1
      evaluate-model-3-kpi:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
      evaluate-model-3-metrics:
        artifactType:
          schemaTitle: system.ClassificationMetrics
          schemaVersion: 0.0.1
      evaluate-model-kpi:
        artifactType:
          schemaTitle: system.Metrics
          schemaVersion: 0.0.1
      evaluate-model-metrics:
        artifactType:
          schemaTitle: system.ClassificationMetrics
          schemaVersion: 0.0.1
schemaVersion: 2.1.0
sdkVersion: kfp-2.7.0
