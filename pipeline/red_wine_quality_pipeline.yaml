deploymentSpec:
  executors:
    exec-download-data-from-gcs:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - download_data_from_gcs
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'google-cloud-storage'\
          \ && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef download_data_from_gcs(project_id: str, bucket_name: str, file_name:\
          \ str, dataset: Output[Dataset]):\n    \"\"\"Download the dataset from a\
          \ Google Cloud Storage bucket.\"\"\"\n    from google.cloud import storage\n\
          \    import pandas as pd\n    import logging\n    import sys\n\n    logging.basicConfig(stream=sys.stdout,\
          \ level=logging.INFO)\n\n    # Initialize the GCS client\n    client = storage.Client(project=project_id)\n\
          \    bucket = client.bucket(bucket_name)\n    blob = bucket.blob(file_name)\n\
          \n    # Download the file to the component's output path\n    blob.download_to_filename(dataset.path\
          \ + \".csv\")\n    logging.info(f\"Dataset '{file_name}' downloaded from\
          \ bucket '{bucket_name}'.\")\n\n"
        image: python:3.10.7-slim
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.7.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'pandas' 'scikit-learn'\
          \ 'numpy' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    input_data: Input[Dataset],\n    model:\
          \ Input[Model],\n    thresholds_dict_str: str,\n    metrics: Output[ClassificationMetrics],\n\
          \    kpi: Output[Metrics]\n) -> NamedTuple('Outputs', [('approval', bool)]):\n\
          \    \"\"\"Evaluate the selected model based on accuracy and decide whether\
          \ to approve it.\"\"\"\n    import pandas as pd\n    import pickle\n   \
          \ import numpy as np\n    from sklearn.metrics import accuracy_score, confusion_matrix\n\
          \    import json\n    import logging\n    import sys\n\n    logging.basicConfig(stream=sys.stdout,\
          \ level=logging.INFO)\n\n    # Load test data\n    data = pd.read_csv(input_data.path\
          \ + \".csv\")\n    X = data.drop('quality', axis=1)\n    y = data['quality']\n\
          \n    # Load the model\n    model_file = model.path + model.metadata[\"\
          file_type\"]\n    with open(model_file, 'rb') as f:\n        loaded_model\
          \ = pickle.load(f)\n\n    # Make predictions\n    y_pred = loaded_model.predict(X)\n\
          \n    # Calculate accuracy\n    accuracy = accuracy_score(y, y_pred)\n \
          \   kpi.log_metric(\"accuracy\", float(accuracy))\n    logging.info(f\"\
          Accuracy: {accuracy}\")\n\n    # Initialize approval as True\n    approval\
          \ = True\n\n    # Load thresholds\n    thresholds_dict = json.loads(thresholds_dict_str)\n\
          \    accuracy_threshold = thresholds_dict.get('accuracy', 0.6)\n\n    if\
          \ accuracy < accuracy_threshold:\n        approval = False\n        logging.info(f\"\
          Model rejected due to accuracy {accuracy} being lower than threshold {accuracy_threshold}\"\
          )\n    else:\n        logging.info(f\"Model approved with accuracy {accuracy}\"\
          )\n\n    # Log confusion matrix\n    cm = confusion_matrix(y, y_pred)\n\
          \    classes = np.unique(y)\n    class_names = [str(cls) for cls in classes]\n\
          \    metrics.log_confusion_matrix(categories=class_names, matrix=cm.tolist())\n\
